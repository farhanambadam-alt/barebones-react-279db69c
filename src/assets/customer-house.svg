<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Chimney -->
  <rect x="66" y="10" width="16" height="30" fill="#5a4e4b" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="64" y="6" width="20" height="6" fill="#d36b54" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Main House Wall -->
  <path d="M 15 45 L 50 15 L 85 45 V 85 H 15 Z" fill="#f4e6d4" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Orange Brick Base Layer -->
  <rect x="15" y="70" width="70" height="15" fill="#ee9c64" stroke="#333" stroke-width="1.5"/>
  <line x1="22" y1="75" x2="28" y2="75" stroke="#d68047" stroke-width="1.5"/>
  <line x1="72" y1="78" x2="78" y2="78" stroke="#d68047" stroke-width="1.5"/>
  <line x1="18" y1="80" x2="24" y2="80" stroke="#d68047" stroke-width="1.5"/>
  
  <!-- Roof -->
  <path d="M 8 48 L 50 10 L 92 48 L 86 54 L 50 20 L 14 54 Z" fill="#e84d3d" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 12 49 L 50 15 L 88 49 L 85 52 L 50 20 L 15 52 Z" fill="#f56b5d" stroke="none"/> <!-- Roof Highlight -->

  <!-- Door -->
  <path d="M 41 48 C 41 45, 59 45, 59 48 V 74 H 41 Z" fill="#e28945" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 43 49 C 43 47, 57 47, 57 49 V 74 H 43 Z" fill="#de7a31" stroke="none"/> <!-- Door Inner shading -->
  <circle cx="44.5" cy="62" r="1.5" fill="#f1c40f" stroke="#333" stroke-width="0.75"/>
  
  <!-- Left Window -->
  <path d="M 21 54 C 21 49, 33 49, 33 54 V 68 H 21 Z" fill="#5bc0de" stroke="#e28945" stroke-width="2" stroke-linejoin="round"/>
  <line x1="21" y1="61" x2="33" y2="61" stroke="#e28945" stroke-width="1.5"/>
  <line x1="27" y1="50" x2="27" y2="68" stroke="#e28945" stroke-width="1.5"/>
  
  <!-- Right Window -->
  <path d="M 67 54 C 67 49, 79 49, 79 54 V 68 H 67 Z" fill="#5bc0de" stroke="#e28945" stroke-width="2" stroke-linejoin="round"/>
  <line x1="67" y1="61" x2="79" y2="61" stroke="#e28945" stroke-width="1.5"/>
  <line x1="73" y1="50" x2="73" y2="68" stroke="#e28945" stroke-width="1.5"/>
  
  <!-- Top Round Window -->
  <circle cx="50" cy="32" r="5.5" fill="#5bc0de" stroke="#e28945" stroke-width="2"/>
  <line x1="44.5" y1="32" x2="55.5" y2="32" stroke="#e28945" stroke-width="1.5"/>
  <line x1="50" y1="26.5" x2="50" y2="37.5" stroke="#e28945" stroke-width="1.5"/>

  <!-- Grey Steps -->
  <rect x="34" y="74" width="32" height="3" fill="#b1b9b9" stroke="#333" stroke-width="1"/>
  <rect x="32" y="77" width="36" height="3" fill="#99a3a4" stroke="#333" stroke-width="1"/>
  <rect x="30" y="80" width="40" height="3" fill="#7f8c8d" stroke="#333" stroke-width="1"/>
  <rect x="28" y="83" width="44" height="4" fill="#626d6e" stroke="#333" stroke-width="1"/>
</svg>
