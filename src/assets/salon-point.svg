<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 250">
  <defs>
    <linearGradient id="chrome-thick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d3d3d" />
      <stop offset="15%" stop-color="#a0a0a0" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cfcfcf" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>

    <linearGradient id="glass-thick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="stripes-thick" width="80" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="80" height="20" fill="#cc0000" />
      <rect y="20" width="80" height="20" fill="#ffffff" />
      <rect y="40" width="80" height="20" fill="#0044aa" />
    </pattern>

    <clipPath id="body-clip">
      <rect x="30" y="45" width="60" height="160" rx="4" />
    </clipPath>
  </defs>

  <g clip-path="url(#body-clip)">
    <rect x="30" y="45" width="60" height="160" fill="url(#stripes-thick)" />
    <rect x="30" y="45" width="60" height="160" fill="url(#glass-thick)" />
    <rect x="38" y="45" width="8" height="160" fill="#ffffff" opacity="0.4" />
  </g>
  
  <rect x="30" y="45" width="60" height="160" rx="4" fill="none" stroke="#333" stroke-width="2" />

  <path d="M 40 25 C 40 5, 80 5, 80 25 Z" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>
  <rect x="20" y="25" width="80" height="10" rx="3" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>
  <rect x="25" y="35" width="70" height="10" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>
  <rect x="28" y="45" width="64" height="6" rx="1" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>

  <rect x="28" y="199" width="64" height="6" rx="1" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>
  <rect x="25" y="205" width="70" height="10" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>
  <rect x="20" y="215" width="80" height="10" rx="3" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>
  <path d="M 40 225 C 40 245, 80 245, 80 225 Z" fill="url(#chrome-thick)" stroke="#222" stroke-width="1.5"/>

  <rect x="100" y="100" width="6" height="50" rx="2" fill="#555" stroke="#222" stroke-width="1"/>
  <rect x="90" y="115" width="10" height="4" fill="#444" />
  <rect x="90" y="131" width="10" height="4" fill="#444" />
</svg>
